name: Verify house price advisor
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python housing.py demo
      - run: python recommend.py --catalog outputs/demo/test_predictions.csv --budget 200000 --output outputs/demo/recommendations
      - run: python -c "import joblib; import housing; joblib.load('outputs/demo/model.joblib')"
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-demo-results
          path: |
            outputs/demo/metrics.json
            outputs/demo/recommendations/
